name: foto_to_erinnerung
description: Erinnerungen manuell erstellen oder aus fotografierten Wochenplänen erkennen.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_mlkit_text_recognition: ^0.17.1
  image_picker: ^1.2.4
  file_picker: ^13.1.0
  shared_preferences: ^2.5.6
  path_provider: ^2.1.5
  intl: ^0.20.2

flutter:
  uses-material-design: true
